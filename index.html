<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digital Design Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* ---------- Base ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Arial', sans-serif; background:#0a0f2c; color:#fff; overflow-x: hidden; }
a { text-decoration:none; color: inherit; }

/* ---------- Container ---------- */
.container {
  max-width: 1200px;
  margin: auto;
  padding: 40px 20px;
}

/* ---------- Heading ---------- */
h1 {
  text-align: center;
  font-size: 2.5em;
  margin-bottom: 40px;
  color: #00ffcc;
}

/* ---------- Grid ---------- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 30px;
}

/* ---------- Card ---------- */
.card {
  position: relative;
  overflow: hidden;
  border-radius: 15px;
  cursor: pointer;
  transform: scale(0.9);
  opacity: 0;
  transition: transform 0.6s ease, opacity 0.6s ease;
}

.card img {
  width: 100%;
  display: block;
  transition: transform 1s ease, filter 0.5s ease;
}

.card:hover img {
  transform: scale(1.1) rotate(1deg);
  filter: brightness(1.2) contrast(1.1);
}

.card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 50%, rgba(0,0,0,0.6) 100%);
  pointer-events: none;
}

.card-caption {
  position: absolute;
  bottom: 20px;
  left: 20px;
  font-size: 1.1em;
  font-weight: bold;
  color: #fff;
  text-shadow: 0 0 10px rgba(0,0,0,0.7);
}

/* ---------- Fade-in + Scale Animation ---------- */
.card.visible {
  transform: scale(1);
  opacity: 1;
}
</style>
</head>
<body>

<div class="container">
  <h1>My Digital Design Portfolio</h1>

  <div class="grid">
    <div class="card">
      <img src="https://picsum.photos/600/400?random=1" alt="Design 1">
      <div class="card-caption">Creative Poster</div>
    </div>
    <div class="card">
      <img src="https://picsum.photos/600/400?random=2" alt="Design 2">
      <div class="card-caption">Cinematic Banner</div>
    </div>
    <div class="card">
      <img src="https://picsum.photos/600/400?random=3" alt="Design 3">
      <div class="card-caption">UI Concept</div>
    </div>
    <div class="card">
      <img src="https://picsum.photos/600/400?random=4" alt="Design 4">
      <div class="card-caption">Motion Graphic</div>
    </div>
    <div class="card">
      <img src="https://picsum.photos/600/400?random=5" alt="Design 5">
      <div class="card-caption">Web Design Mockup</div>
    </div>
    <div class="card">
      <img src="https://picsum.photos/600/400?random=6" alt="Design 6">
      <div class="card-caption">Digital Illustration</div>
    </div>
  </div>
</div>

<script>
// ---------- Fade-in + Scale on scroll ----------
const cards = document.querySelectorAll('.card');

function revealCards() {
  const triggerBottom = window.innerHeight * 0.85;

  cards.forEach(card => {
    const cardTop = card.getBoundingClientRect().top;
    if (cardTop < triggerBottom) {
      card.classList.add('visible');
    }
  });
}

window.addEventListener('scroll', revealCards);
window.addEventListener('load', revealCards);
</script>

</body>
</html>
