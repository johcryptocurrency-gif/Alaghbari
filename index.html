<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>اختبار أنماط الشخصية MBTI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial, sans-serif; background:#f0f0f0; color:#333; padding:20px; direction: rtl; }
h1 { text-align:center; color:#0077cc; }
.container { max-width:800px; margin:auto; background:#fff; padding:20px; border-radius:10px; box-shadow:0 0 15px rgba(0,0,0,0.1);}
.question { margin-bottom:20px; }
button { padding:10px 25px; background:#0077cc; color:#fff; border:none; border-radius:5px; cursor:pointer; }
button:hover { background:#005fa3; }
#result { margin-top:20px; padding:20px; background:#e0f0ff; border-radius:10px; }
label { display:block; margin-top:5px; }
</style>
</head>
<body>

<div class="container">
  <h1>اختبار MBTI لأنماط الشخصية</h1>
  <form id="mbtiForm"></form>
  <button type="button" onclick="calculateMBTI()">عرض النتيجة</button>
  <div id="result"></div>
</div>

<script>
// ---------- أسئلة MBTI حقيقية (14 سؤال نموذجياً) ----------
const questions = [
  { q:"عندما تكون في اجتماع، هل تشعر بطاقة أكبر عند التفاعل مع الآخرين أم عند التركيز على أفكارك الخاصة؟", options:["الانبساط (E)","الانطواء (I)"], type:"EI" },
  { q:"هل تفضل التركيز على الحقائق والتفاصيل الدقيقة أم على الأفكار والإمكانيات المستقبلية؟", options:["الحسية (S)","الحدسية (N)"], type:"SN" },
  { q:"عند اتخاذ القرارات، هل تميل إلى المنطق والتحليل أم إلى المشاعر والقيم الشخصية؟", options:["التفكير (T)","الشعور (F)"], type:"TF" },
  { q:"هل تحب وجود خطة محددة ومنظمة أم تفضل المرونة وترك الخيارات مفتوحة؟", options:["الحكم (J)","الإدراك (P)"], type:"JP" },

  { q:"هل تشعر بالراحة أكثر في المواقف الاجتماعية النشطة أم في الوقت الذي تقضيه بمفردك؟", options:["E","I"], type:"EI" },
  { q:"هل تميل إلى الاعتماد على المعلومات الملموسة والتجربة أم على الحدس والإلهام؟", options:["S","N"], type:"SN" },
  { q:"عند حل المشاكل، هل تعتمد على التحليل الموضوعي أم على مشاعر الآخرين؟", options:["T","F"], type:"TF" },
  { q:"هل تحب الالتزام بالجدول والمواعيد أم تفضل التكيف مع المواقف؟", options:["J","P"], type:"JP" },

  { q:"هل تفضل العمل ضمن فريق كبير أم إنجاز المهام بمفردك؟", options:["E","I"], type:"EI" },
  { q:"هل تبحث عن التفاصيل الدقيقة أم عن الصورة الكلية؟", options:["S","N"], type:"SN" },
  { q:"هل تؤثر العدل أكثر على قراراتك أم التعاطف والرحمة؟", options:["T","F"], type:"TF" },
  { q:"هل تفضل التخطيط المسبق أم العمل بطريقة عفوية؟", options:["J","P"], type:"JP" },

  { q:"هل تشعر بالنشاط والطاقة عند المشاركة في الأنشطة الجماعية؟", options:["E","I"], type:"EI" },
  { q:"هل تركز على التفاصيل الدقيقة أم على الإمكانيات المستقبلية والأفكار الكبرى؟", options:["S","N"], type:"SN" },
];

// ---------- توليد الأسئلة ----------
const form = document.getElementById('mbtiForm');
questions.forEach((item,index)=>{
  const div = document.createElement('div');
  div.className = "question";
  div.innerHTML = `<p>${index+1}. ${item.q}</p>
    <label><input type="radio" name="q${index}" value="${item.options[0]}" required> ${item.options[0]}</label>
    <label><input type="radio" name="q${index}" value="${item.options[1]}" required> ${item.options[1]}</label>`;
  form.appendChild(div);
});

// ---------- وصف تفصيلي علمي لكل نوع شخصية ----------
const mbtiDescriptions = {
  "ISTJ":"<strong>ISTJ:</strong> واقعي، منظم، ملتزم بالقواعد، يحب المسؤولية والمهام المحددة.<br>نقاط القوة: دقة، مسؤولية، اعتمادية.<br>نقاط الضعف: تمسك بالقواعد أحياناً، صعوبة التكيف مع التغيير.",
  "ISFJ":"<strong>ISFJ:</strong> ودود، موثوق، يهتم بالآخرين، عملي ويحب تقديم الدعم.<br>نقاط القوة: التعاطف، الولاء، المسؤولية.<br>نقاط الضعف: تجنب المواجهة، قد يبالغ في خدمة الآخرين.",
  "INFJ":"<strong>INFJ:</strong> مبدع، متفهم، لديه رؤية عميقة، يركز على تطوير الذات والآخرين.<br>نقاط القوة: حدس قوي، رؤية مستقبلية، إلهام الآخرين.<br>نقاط الضعف: حساس للغاية، يميل للعزلة.",
  "INTJ":"<strong>INTJ:</strong> استراتيجي، محلل، مستقل، يركز على التخطيط والتطوير.<br>نقاط القوة: تفكير منطقي، استقلالية، تنظيم.<br>نقاط الضعف: يميل إلى الانعزال، صعوبة التعبير عن المشاعر.",
  "ISTP":"<strong>ISTP:</strong> عملي، ملاحظ، متكيف، يحب التجربة وحل المشاكل.<br>نقاط القوة: مرونة، مهارات تقنية، هدوء.<br>نقاط الضعف: عدم صبر في التفاصيل، يحب الحرية.",
  "ISFP":"<strong>ISFP:</strong> لطيف، مرن، حساس، يحب الفن والجمال.<br>نقاط القوة: تعاطف، مرونة، تقدير الجمال.<br>نقاط الضعف: صعوبة مواجهة المشاكل، لا يحب القيود.",
  "INFP":"<strong>INFP:</strong> مثالي، متعاطف، متأمل، يسعى للقيم والمعاني.<br>نقاط القوة: إبداع، قيم أخلاقية، تفكير عميق.<br>نقاط الضعف: حساسية مفرطة، الانعزال أحياناً.",
  "INTP":"<strong>INTP:</strong> محلل، فضولي، مبتكر، يحب الأفكار والمفاهيم.<br>نقاط القوة: تفكير منطقي، ابتكار، استقلالية.<br>نقاط الضعف: صعوبة اتخاذ القرارات، الانعزال الاجتماعي.",
  "ESTP":"<strong>ESTP:</strong> نشيط، عملي، مغامر، يفضل التجربة المباشرة.<br>نقاط القوة: سرعة البديهة، مرونة، حب التجربة.<br>نقاط الضعف: تهور أحياناً، تململ سريع.",
  "ESFP":"<strong>ESFP:</strong> اجتماعي، مرح، يحب التفاعل مع الآخرين واللحظة.<br>نقاط القوة: اجتماعي، متعة، مرونة.<br>نقاط الضعف: صعوبة التخطيط، انفعال سريع.",
  "ENFP":"<strong>ENFP:</strong> متحمس، خلاق، اجتماعي، يحب استكشاف الإمكانيات.<br>نقاط القوة: إبداع، حيوية، تفاؤل.<br>نقاط الضعف: تشتيت، صعوبة الالتزام.",
  "ENTP":"<strong>ENTP:</strong> مبتكر، ذكي، يحب التحدي والاستكشاف.<br>نقاط القوة: ابتكار، مرونة، حماس.<br>نقاط الضعف: عدم الانضباط، صعوبة التركيز الطويل.",
  "ESTJ":"<strong>ESTJ:</strong> منظم، حازم، يعتمد على المنطق والتخطيط.<br>نقاط القوة: قيادة، تنظيم، مسؤولية.<br>نقاط الضعف: صرامة أحياناً، صعوبة التكيف مع التغيير.",
  "ESFJ":"<strong>ESFJ:</strong> متعاون، اجتماعي، يهتم بالآخرين ويحب التنظيم.<br>نقاط القوة: ولاء، دعم، اجتماعية.<br>نقاط الضعف: خوف من الرفض، تمسك بالرأي العام.",
  "ENFJ":"<strong>ENFJ:</strong> كاريزمي، متفهم، قادر على تحفيز الآخرين.<br>نقاط القوة: قيادة، تعاطف، إلهام.<br>نقاط الضعف: تحمل ضغط الآخرين، حساس للمشاعر.",
  "ENTJ":"<strong>ENTJ:</strong> قائد، استراتيجي، واثق، يحب التخطيط والتنفيذ.<br>نقاط القوة: قيادة، تنظيم، استراتيجية.<br>نقاط الضعف: صرامة، قلة الصبر مع الضعفاء."
};

// ---------- حساب النتيجة ----------
function calculateMBTI(){
  const answers = new FormData(form);
  let scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};

  questions.forEach((item,index)=>{
    const ans = answers.get('q'+index);
    if(ans.includes("E") || ans.includes("الانبساط")) scores.E++;
    if(ans.includes("I") || ans.includes("الانطواء")) scores.I++;
    if(ans.includes("S") || ans.includes("الحسية")) scores.S++;
    if(ans.includes("N") || ans.includes("الحدسية")) scores.N++;
    if(ans.includes("T") || ans.includes("التفكير")) scores.T++;
    if(ans.includes("F") || ans.includes("الشعور")) scores.F++;
    if(ans.includes("J") || ans.includes("الحكم")) scores.J++;
    if(ans.includes("P") || ans.includes("الإدراك")) scores.P++;
  });

  const EI = scores.E >= scores.I ? "E" : "I";
  const SN = scores.S >= scores.N ? "S" : "N";
  const TF = scores.T >= scores.F ? "T" : "F";
  const JP = scores.J >= scores.P ? "J" : "P";

  const mbtiType = EI+SN+TF+JP;
  const description = mbtiDescriptions[mbtiType] || "وصف غير متوفر لهذا النوع.";

  document.getElementById('result').innerHTML = `<h2>نوع شخصيتك: ${mbtiType}</h2><p>${description}</p>`;
}
</script>

</body>
</html>
