<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Image to Cinematic Video</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial; background:#0a0f2c; color:#fff; text-align:center; padding:20px; }
input, button { margin:10px 0; padding:12px; width:90%; max-width:400px; border-radius:6px; border:none; }
button { background:#00ffcc; color:#000; font-weight:bold; cursor:pointer; }
video { width:100%; max-width:600px; margin-top:20px; border-radius:10px; }
#status { color:#00ffcc; margin-top:10px; font-weight:bold; }
a { display:block; margin-top:10px; color:#00ffcc; text-decoration:none; font-weight:bold; }
</style>
</head>
<body>

<h1>AI Image → 15s Cinematic Video</h1>

<input type="file" id="imageInput" accept="image/*"><br>
<input type="text" id="prompt" placeholder="Describe cinematic scene..." value="Dynamic cinematic motion, smooth camera movement"><br>

<button id="generateBtn">Generate Cinematic Video</button>

<p id="status">Or try the <a href="demo/demo_video.mp4" target="_blank">Demo Video</a></p>

<video id="resultVideo" controls style="display:none"></video>
<a id="downloadBtn" style="display:none;"></a>

<script>
const imageInput = document.getElementById('imageInput');
const promptInput = document.getElementById('prompt');
const generateBtn = document.getElementById('generateBtn');
const statusEl = document.getElementById('status');
const resultVideo = document.getElementById('resultVideo');
const downloadBtn = document.getElementById('downloadBtn');

// ضع هنا API Key من deAPI أو أي خدمة Image-to-Video
const API_URL = "https://api.deapi.ai/api/v1/client/img2video";
const API_KEY = "YOUR_API_KEY_HERE";

generateBtn.addEventListener('click', async () => {
    const file = imageInput.files[0];
    const prompt = promptInput.value.trim();
    if (!file) return alert("Please select an image to generate video.");

    statusEl.innerText = "Preparing image and starting video generation...";

    const formData = new FormData();
    formData.append("first_frame_image", file);
    formData.append("prompt", prompt);
    formData.append("frames", 450);
    formData.append("fps", 30);

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Authorization": `Bearer ${API_KEY}` },
            body: formData
        });
        const data = await response.json();
        if (!data.request_id) throw new Error("Unexpected response from the server.");

        statusEl.innerText = "Video generation in progress. Please wait...";
        pollForResult(data.request_id);
    } catch (err) {
        statusEl.innerText = "Error starting video generation: " + err.message;
        console.error(err);
    }
});

async function pollForResult(requestId) {
    try {
        const res = await fetch(`${API_URL}/${requestId}`, {
            method: "GET",
            headers: { "Authorization": `Bearer ${API_KEY}` }
        });
        const info = await res.json();

        if (info.status === "completed" && info.video_url) {
            statusEl.innerText = "Video is ready for preview and download.";
            resultVideo.src = info.video_url;
            resultVideo.style.display = "block";

            downloadBtn.href = info.video_url;
            downloadBtn.download = "cinematic_ai_video.mp4";
            downloadBtn.innerText = "Download Video";
            downloadBtn.style.display = "block";

        } else if (info.status === "processing") {
            statusEl.innerText = "Processing video... " + (info.progress || "") + "% completed";
            setTimeout(() => pollForResult(requestId), 3000);
        } else {
            statusEl.innerText = "Video generation could not be completed. Please try again.";
        }
    } catch (err) {
        statusEl.innerText = "An error occurred while checking video status: " + err.message;
        console.error(err);
    }
}
</script>

</body>
</html>
