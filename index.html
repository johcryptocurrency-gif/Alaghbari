<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vision3D AI – Full GPU Pipeline</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root { --bg:#0a0f2c; --accent:#00ffcc; }
body { margin:0; background:var(--bg); color:#fff; font-family:Arial,sans-serif; }
.container { max-width:560px; margin:auto; padding:20px; }
h1 { text-align:center; }
input,button { width:100%; margin-top:12px; padding:12px; border-radius:6px; border:none; }
button { background:var(--accent); font-weight:bold; cursor:pointer; }
progress { width:100%; margin-top:10px; }
video, canvas { width:100%; margin-top:15px; border-radius:10px; }
.badge { text-align:center; margin-top:5px; color:var(--accent); font-size:13px; }
</style>
</head>

<body>
<div class="container">
  <h1>Vision3D AI</h1>
  <div class="badge">GPU + WASM AI Video Pipeline</div>

  <input type="file" id="videoInput" accept="video/*">
  <button onclick="runPipeline()">Process & Export</button>

  <progress id="progress" value="0" max="100"></progress>

  <video id="preview" controls></video>
  <a id="download" style="display:none;"></a>

  <canvas id="canvas" style="display:none;"></canvas>
</div>

<script>
// ====== Setup ======
const video = document.getElementById("preview");
const canvas = document.getElementById("canvas");
const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
const progress = document.getElementById("progress");
const download = document.getElementById("download");

let recorder, chunks = [];

// ====== Shaders ======
const vertexShaderSrc = `
attribute vec2 a_position;
varying vec2 v_uv;
void main() {
  v_uv = (a_position + 1.0) * 0.5;
  gl_Position = vec4(a_position, 0, 1);
}`;
const fragmentShaderSrc = `
precision mediump float;
uniform sampler2D u_texture;
varying vec2 v_uv;
void main() {
  vec4 color = texture2D(u_texture, v_uv);

  // AI-style cinematic + edge enhance
  float edge = length(color.rgb - vec3(0.5));
  color.rgb = pow(color.rgb, vec3(1.2)) + edge*0.2;

  gl_FragColor = color;
}`;

// ====== Compile Shader ======
function compileShader(type, src) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, src);
  gl.compileShader(shader);
  if(!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
    console.error(gl.getShaderInfoLog(shader));
  return shader;
}

// ====== Init WebGL ======
const vertexShader = compileShader(gl.VERTEX_SHADER, vertexShaderSrc);
const fragmentShader = compileShader(gl.FRAGMENT_SHADER, fragmentShaderSrc);
const program = gl.createProgram();
gl.attachShader(program, vertexShader);
gl.attachShader(program, fragmentShader);
gl.linkProgram(program);
gl.useProgram(program);

const posBuffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

const posLoc = gl.getAttribLocation(program,"a_position");
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc,2,gl.FLOAT,false,0,0);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

const uTextureLoc = gl.getUniformLocation(program, "u_texture");

// ====== Pipeline ======
function runPipeline() {
  const file = document.getElementById("videoInput").files[0];
  if(!file) return alert("Select a video file");

  chunks = [];
  video.src = URL.createObjectURL(file);
  video.muted = true;
  video.play();

  video.onloadeddata = () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const stream = canvas.captureStream(30);
    recorder = new MediaRecorder(stream, { mimeType: "video/webm; codecs=vp8" });
    recorder.ondataavailable = e => { if(e.data && e.data.size>0) chunks.push(e.data); };
    recorder.onstop = finalizeExport;
    recorder.start();

    renderFrames();
  };
}

// ====== Render Frames (WebGL + AI-style) ======
function renderFrames() {
  const duration = video.duration;

  function draw() {
    if(video.paused || video.ended) {
      recorder.stop();
      return;
    }

    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);

    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

    progress.value = Math.min((video.currentTime/duration)*100,100);
    requestAnimationFrame(draw);
  }
  draw();
}

// ====== Export Final Video ======
function finalizeExport() {
  if(chunks.length===0) return alert("No video captured!");

  const blob = new Blob(chunks, { type: 'video/webm' });
  const url = URL.createObjectURL(blob);

  download.href = url;
  download.download = "vision3d_full.webm";
  download.innerText = "⬇ Download Final Video";
  download.style.display = "block";

  // Show in player
  video.src = url;
  video.controls = true;
  video.play();
}
</script>
</body>
</html>
