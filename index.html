<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>اختبار MBTI - 14 سؤال</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial, sans-serif; background:#f0f0f0; color:#333; padding:20px; direction: rtl; }
h1 { text-align:center; color:#0077cc; }
.container { max-width:700px; margin:auto; background:#fff; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1);}
.question { margin-bottom:20px; }
button { padding:10px 20px; background:#0077cc; color:#fff; border:none; border-radius:5px; cursor:pointer; }
button:hover { background:#005fa3; }
#result { margin-top:20px; padding:15px; background:#e0f0ff; border-radius:10px; }
label { display:block; margin-top:5px; }
</style>
</head>
<body>

<div class="container">
  <h1>اختبار MBTI الشخصي (14 سؤال)</h1>
  <form id="mbtiForm">
    <!-- الأسئلة ستضاف تلقائيًا -->
  </form>
  <button type="button" onclick="calculateMBTI()">عرض النتيجة</button>
  <div id="result"></div>
</div>

<script>
// ---------- تعريف الأسئلة باللغة العربية ----------
const questions = [
  { q:"هل تفضل التركيز على العالم الخارجي أم على عالمك الداخلي؟", options:["الانبساط (E)","الانطواء (I)"], type:"EI" },
  { q:"هل تفضل التركيز على المعلومات الأساسية أم تفسيرها وإضافة معنى؟", options:["الحسية (S)","الحدسية (N)"], type:"SN" },
  { q:"عند اتخاذ القرارات، هل تعتمد على المنطق أم على المشاعر والقيم الشخصية؟", options:["التفكير (T)","الشعور (F)"], type:"TF" },
  { q:"هل تفضل اتخاذ القرارات سريعًا أم تفضل ترك الأمور مفتوحة؟", options:["الحكم (J)","الإدراك (P)"], type:"JP" },

  { q:"هل تشعر بالنشاط عند التفاعل مع الآخرين أم عند قضاء الوقت بمفردك؟", options:["E","I"], type:"EI" },
  { q:"هل تفضل الحقائق الملموسة أم الاحتمالات المجردة؟", options:["S","N"], type:"SN" },
  { q:"هل تعتمد في قراراتك على المنطق أم القيم الشخصية؟", options:["T","F"], type:"TF" },
  { q:"هل تفضل التخطيط والتنظيم أم المرونة والعفوية؟", options:["J","P"], type:"JP" },

  { q:"هل تشعر بالراحة في المجموعات أم تفضل اللقاءات الصغيرة؟", options:["E","I"], type:"EI" },
  { q:"هل تثق في الخبرة أم في الإلهام والحدس؟", options:["S","N"], type:"SN" },
  { q:"هل تقدر العدالة أم التعاطف أكثر؟", options:["T","F"], type:"TF" },
  { q:"هل تحب اتباع جداول منظمة أم الترتيب العفوي؟", options:["J","P"], type:"JP" },

  { q:"هل تستمتع بالنشاط الاجتماعي؟", options:["E","I"], type:"EI" },
  { q:"هل تركز على التفاصيل أم على الصورة الكبيرة؟", options:["S","N"], type:"SN" },
];

// ---------- توليد الأسئلة في النموذج ----------
const form = document.getElementById('mbtiForm');
questions.forEach((item,index)=>{
  const div = document.createElement('div');
  div.className = "question";
  div.innerHTML = `<p>${index+1}. ${item.q}</p>
    <label><input type="radio" name="q${index}" value="${item.options[0]}" required> ${item.options[0]}</label>
    <label><input type="radio" name="q${index}" value="${item.options[1]}" required> ${item.options[1]}</label>`;
  form.appendChild(div);
});

// ---------- تعريف وصف كل نوع ----------
const mbtiDescriptions = {
  "ISTJ":"منظم، مسؤول، يهتم بالتفاصيل ويحب الالتزام بالقواعد.",
  "ISFJ":"ودود، موثوق، يهتم بالآخرين ومسؤول.",
  "INFJ":"مبدع، متفهم، يتمتع برؤية عميقة.",
  "INTJ":"استراتيجي، محلل، مستقل ويحب التخطيط.",
  "ISTP":"عملي، ملاحظ، يتكيف مع المواقف بسهولة.",
  "ISFP":"لطيف، مرن، حساس ويقدر الجمال.",
  "INFP":"مثالي، متعاطف، متأمل ويبحث عن المعنى.",
  "INTP":"محلل، فضولي، مبتكر ويحب الأفكار الجديدة.",
  "ESTP":"نشط، عملي، يحب التجربة والمغامرة.",
  "ESFP":"اجتماعي، مرح، يحب التفاعل مع الآخرين.",
  "ENFP":"متحمس، خلاق، اجتماعي ويحب الأفكار الجديدة.",
  "ENTP":"مبتكر، ذكي، يحب التحدي والاستكشاف.",
  "ESTJ":"منظم، حازم، يعتمد على المنطق والتخطيط.",
  "ESFJ":"متعاون، اجتماعي، يهتم بالآخرين ويحب التنظيم.",
  "ENFJ":"كاريزمي، متفهم، قادر على تحفيز الآخرين.",
  "ENTJ":"قائد، استراتيجي، واثق من نفسه ويحب التخطيط."
};

// ---------- حساب نتيجة MBTI ----------
function calculateMBTI(){
  const answers = new FormData(form);
  let scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};

  questions.forEach((item,index)=>{
    const ans = answers.get('q'+index);
    if(ans.includes("E") || ans.includes("الانبساط")) scores.E++;
    if(ans.includes("I") || ans.includes("الانطواء")) scores.I++;
    if(ans.includes("S") || ans.includes("الحسية")) scores.S++;
    if(ans.includes("N") || ans.includes("الحدسية")) scores.N++;
    if(ans.includes("T") || ans.includes("التفكير")) scores.T++;
    if(ans.includes("F") || ans.includes("الشعور")) scores.F++;
    if(ans.includes("J") || ans.includes("الحكم")) scores.J++;
    if(ans.includes("P") || ans.includes("الإدراك")) scores.P++;
  });

  const EI = scores.E >= scores.I ? "E" : "I";
  const SN = scores.S >= scores.N ? "S" : "N";
  const TF = scores.T >= scores.F ? "T" : "F";
  const JP = scores.J >= scores.P ? "J" : "P";

  const mbtiType = EI+SN+TF+JP;
  const description = mbtiDescriptions[mbtiType] || "وصف غير متوفر لهذا النوع.";

  document.getElementById('result').innerHTML = `<h2>نوع شخصيتك: ${mbtiType}</h2><p>${description}</p>`;
}
</script>

</body>
</html>
